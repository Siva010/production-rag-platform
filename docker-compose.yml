version: '3.8'

services:
  redis:
    # Pin to a specific minor version to avoid unexpected breaking changes from 'latest'
    image: "redis:7.4-alpine"
    container_name: my-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  rate-limiter-service:
    build: ./rate-limiter-service
    container_name: rate-limiter-service
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    environment:
      - RATE_LIMITER_BUCKET_CAPACITY=10
      - RATE_LIMITER_REFILL_RATE_PER_MINUTE=10
      - SPRING_DATA_REDIS_HOST=my-redis
      # Override the downstream product-service URL (matches product-service.url in application.yml)
      - PRODUCT_SERVICE_URL=http://product-service:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      rate-limiter-service:
        condition: service_healthy
